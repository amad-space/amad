<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أَمَد | مساحتك الهادئة للبطاقات الرقمية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        header {
            text-align: center;
            margin: 40px 0 20px;
        }
        h1 {
            font-size: 3rem;
            color: #d4af37;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
        }
        .container {
            max-width: 800px;
            width: 100%;
            margin-top: 20px;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .digital-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .digital-card:hover {
            transform: translateY(-5px);
            border-color: #d4af37;
        }
        .card-title {
            font-size: 1.3rem;
            color: #fff;
            margin-bottom: 10px;
        }
        .card-price {
            font-size: 1.5rem;
            color: #d4af37;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .benefit-btn {
            display: inline-block;
            background: #d4af37;
            color: #0f172a;
            padding: 12px 25px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            transition: background 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        .benefit-btn:hover {
            background: #e6c55c;
            transform: scale(1.05);
        }
        footer {
            margin-top: auto;
            color: #64748b;
            font-size: 0.9rem;
            padding: 20px 0;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>أَمَد</h1>
        <p class="subtitle">مساحتك الهادئة للبطاقات الرقمية المميزة</p>
    </header>

    <div class="container">
        <div class="card-grid">
            <!-- البطاقة الأولى -->
            <div class="digital-card">
                <div class="card-title">بطاقة شكر وتقدير</div>
                <div class="card-price">500 فلس</div>
                <!-- رابط بنفت باي (يمكنك استبدال الرقم برقم الهاتف الخاص بالتحويل أو رابط بنفت المباشر) -->
                <a href="https://www.benefitpay.bh" target="_blank" class="benefit-btn">اطلبها عبر BenefitPay</a>
            </div>

            <!-- البطاقة الثانية -->
            <div class="digital-card">
                <div class="card-title">بطاقة تهنئة خاصة</div>
                <div class="card-price">500 فلس</div>
                <a href="https://www.benefitpay.bh" target="_blank" class="benefit-btn">اطلبها عبر BenefitPay</a>
            </div>
        </div>
    </div>

    <footer>
        جميع الحقوق محفوظة لموقع أَمَد &copy; 2026
    </footer>

</body>
</html>
