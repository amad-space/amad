<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أَمَدْ — مساحة المشاعر الحية</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --a:#f8d7e6;
  --b:#d8e8f8;
  --c:#e2d8f8;
  --gold:#e9c46a;
  --base:#fffdfb;
  --ink:#3d364a;
  --soft:#78708c;
  --card:rgba(255,255,255,0.85);
  --line:rgba(120,112,150,0.15);
  --shadow:rgba(60,50,90,0.06);
}

[data-theme="lavender"] {
  --a:#ede7f6; --b:#d1c4e9; --c:#b39ddb; --gold:#b388ff;
  --base:#f8f6fc; --ink:#312642; --soft:#675880;
}
[data-theme="mint"] {
  --a:#e0f2f1; --b:#b2dfdb; --c:#80cbc4; --gold:#26a69a;
  --base:#f4fbfb; --ink:#123531; --soft:#487a74;
}
[data-theme="sunset"] {
  --a:#fff3e0; --b:#ffe0b2; --c:#ffccbc; --gold:#ff7043;
  --base:#fffbf7; --ink:#3e2723; --soft:#8d6e63;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Readex Pro', Tahoma, sans-serif;
  color: var(--ink);
  background: linear-gradient(135deg, var(--a), var(--b), var(--c));
  background-attachment: fixed;
  background-size: 400% 400%;
  animation: bgPulse 18s ease infinite;
  padding-bottom: 50px;
  position: relative;
  overflow-x: hidden;
}

@keyframes bgPulse {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* نجوم تتلألأ في الخلفية */
.stars-sky {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
  z-index: 1;
}
.star-dot {
  position: absolute;
  background: #ffffff;
  border-radius: 50%;
  animation: twinkle 3s infinite ease-in-out, floatStar 7s infinite linear;
  opacity: 0.8;
}
@keyframes twinkle {
  0%, 100% { transform: scale(0.4); opacity: 0.2; }
  50% { transform: scale(1.6); opacity: 1; box-shadow: 0 0 12px var(--gold); }
}
@keyframes floatStar {
  0% { transform: translateY(0px) rotate(0deg); }
  50% { transform: translateY(-25px) rotate(180deg); }
  100% { transform: translateY(0px) rotate(360deg); }
}

.wrap {
  max-width: 600px;
  margin: 0 auto;
  padding: 30px 20px;
  position: relative;
  z-index: 2;
}

/* شريط تغيير الألوان الحية */
.mood-dock {
  display: flex;
  justify-content: center;
  gap: 12px;
  background: var(--card);
  backdrop-filter: blur(15px);
  padding: 8px 20px;
  border-radius: 999px;
  border: 1px solid var(--line);
  box-shadow: 0 10px 30px var(--shadow);
  width: max-content;
  margin: 0 auto 20px;
}
.mood-dot {
  width: 24px; height: 24px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  transition: transform 0.3s;
}
.mood-dot:hover { transform: scale(1.25); }
